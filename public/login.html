<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<script>
// One sign-in covers every strategicdoinginitiatives.com site. This page sends people to it.
(function () {
  var p = new URLSearchParams(location.search), next = p.get('next') || '/';
  if (next.charAt(0) !== '/' || next.charAt(1) === '/' || next.charAt(1) === '\\') next = '/';
  location.replace('https://strategicdoinginitiatives.com/login?next=' + encodeURIComponent(location.origin + next));
})();
</script></head>
<body style="font:16px/1.5 system-ui,sans-serif;margin:48px 16px"><p><a href="https://strategicdoinginitiatives.com/login">Continue to the Strategic Doing sign-in page</a></p></body></html>
