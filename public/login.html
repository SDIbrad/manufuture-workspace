<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · ManuFuture workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="/brand/sd.css">
<style>
main{max-width:440px;margin:48px auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
h1{font-family:var(--display);font-weight:800;color:var(--brand);font-size:26px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible{outline:2px solid var(--link);outline-offset:1px}
button{margin-top:14px;width:100%;padding:11px;font:inherit;font-weight:600;background:var(--brand);color:#fff;border:0;border-radius:8px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0F1419}}
button:disabled{opacity:.6}
#msg{margin-top:14px}#msg.err{color:var(--sd-red-t)}
</style></head><body>
<header class="sbar"><div class="sbar-in"><a class="slogo" href="/"><img class="logo-light" src="/brand/sd-logo-color.svg" alt="Strategic Doing"><img class="logo-dark" src="/brand/sd-logo-white.svg" alt="Strategic Doing"><span class="sep"></span><span class="lbl">ManuFuture workspace</span></a></div></header><div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main><div class="card">
<h1>Sign in</h1>
<p>This workspace is private. Enter your email address and we will send you a sign-in link. Only invited addresses can sign in.</p>
<form id="f"><label for="em">Email address</label><input id="em" type="email" autocomplete="email" required><button id="go" type="submit">Email me a sign-in link</button></form>
<div id="msg" role="status"></div>
</div></main>
<script src="/vendor/supabase-js-2.45.4.js"></script>
<script src="/auth.js"></script>
<script>
(async () => {
  const { sb, setCookie } = window.WORKSPACE_AUTH;
  const params = new URLSearchParams(location.search);
  let next = params.get('next') || '/';
  if (!next.startsWith('/') || next.startsWith('//')) next = '/';
  const msg = document.getElementById('msg');
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('error_description')) { msg.className = 'err'; msg.textContent = 'That sign-in link did not work: ' + hash.get('error_description') + '. Request a new one below.'; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { setCookie(session); location.replace(next); return; }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'); btn.disabled = true; msg.className = ''; msg.textContent = 'Sending…';
    const email = document.getElementById('em').value.trim().toLowerCase();
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + '/login.html?next=' + encodeURIComponent(next) } });
    btn.disabled = false;
    if (error && !/signups not allowed|not found/i.test(error.message)) { msg.className = 'err'; msg.textContent = 'The link could not be sent (' + error.message + '). Try again in a minute.'; return; }
    msg.textContent = 'If ' + email + ' has access, a sign-in link is on its way. Open it in this browser.';
  });
})();
</script></body></html>
